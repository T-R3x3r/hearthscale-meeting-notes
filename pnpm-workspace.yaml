# The app is its own project, never part of another workspace.
# esbuild (via Vite) needs its install script to fetch its native binary.
allowBuilds:
  esbuild: true
# pnpm refuses packages published less than a day ago; the SDK versions the
# lockfile holds are allowed before that day ends.
minimumReleaseAgeExclude:
  - '@hearthscale/app@0.2.1'
  - '@hearthscale/app-ui@0.2.1'
